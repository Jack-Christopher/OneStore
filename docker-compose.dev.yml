services:
  onestore-frontend:
    build:
      context: ./frontend
      dockerfile: Dev.Dockerfile
    container_name: onestore_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dev.Dockerfile
    container_name: onestore_api
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=4000
      # MongoDB connection with authentication - authSource=admin ensures we authenticate against the admin database
      - MONGO_URI=mongodb://admin:devpassword@db:27017/onestore?authSource=admin
      - JWT_SECRET=supersecret
    depends_on:
      - db

  db:
    image: mongo:7
    container_name: onestore_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./backend/mongod.conf:/etc/mongod.conf
    environment:
      # MongoDB authentication for dev environment
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=devpassword
      - MONGO_INITDB_DATABASE=onestore
    command: [ "mongod", "--config", "/etc/mongod.conf" ]

volumes:
  mongo_data:
