version: "3.9"

services:
  onestore-frontend:
    build:
      context: ./frontend
      dockerfile: Dev.Dockerfile
    container_name: onestore_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
    restart: unless-stopped
