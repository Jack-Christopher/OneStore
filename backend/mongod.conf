storage:
  dbPath: /data/db

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0

# SECURITY: Authorization must be enabled to enforce authentication.
# This ensures that only authenticated users can access the database.
# Without this setting, MongoDB will accept connections without credentials,
# making it vulnerable to unauthorized access even if users are created.
security:
  authorization: enabled
